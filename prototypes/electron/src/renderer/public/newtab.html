<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Yeni sekme</title>
    <!--
      Served as yalqen://newtab/ by the main process, which adds class="animate"
      to <html> on the first new tab page of each launch.
    -->
    <style>
      :root {
        --page: #ffffff;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #262624;
          color-scheme: dark;
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: var(--page);
        overflow: hidden;
        user-select: none;
      }

      svg {
        width: min(560px, 68vw);
        height: auto;
        /* Sits slightly above the optical centre, like a title. */
        margin-bottom: 8vh;
      }

      .animate path {
        stroke-dasharray: 1 1.01;
        stroke-dashoffset: 1.001;
        animation: write 2.8s cubic-bezier(0.45, 0.05, 0.3, 1) 0.25s forwards;
      }

      @keyframes write {
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .animate path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 40 500 180" role="img" aria-label="merhaba">
      <defs>
        <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="480" y2="0">

</html>
