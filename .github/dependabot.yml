version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/browser
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Matches the Node.js 24 runtime used in CI and Electron.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # svelte-check and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      git-hooks:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      codeql:
        patterns: ['github/codeql-action/*']
