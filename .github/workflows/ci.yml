name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm ci
      - run: npm run test:macos
      - run: npm run build:renderer
      - run: node scripts/test-runtime.mjs

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - name: Prepare the Linux runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 dbus-x11 gnome-keyring libsecret-1-0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run check:static
      - run: npm run test:linux
      - run: npm run build:renderer
      - name: Run Electron tests with a display and an unlocked test keyring
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "yalqen-ci" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node scripts/test-runtime.mjs
          '
      - run: npm exec electron-builder -- --linux --publish never
      - name: Verify the packaged Chromium sandbox
        run: xvfb-run -a node scripts/test-linux-appimage.mjs release/Yalqen-*.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm ci
      - run: npm run test:windows
      - run: npm run build:renderer
      - run: node scripts/test-runtime.mjs
      - run: npm exec electron-builder -- --win --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yalqen-win
          path: apps/browser/release/*.exe
