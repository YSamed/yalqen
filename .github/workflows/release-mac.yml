name: Release (macOS)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: apps/browser
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Write the App Store Connect key for notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Import the signing certificate
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        if: env.MAC_CERTIFICATE_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Write the provisioning profile
        env:
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        if: env.MAC_PROVISIONING_PROFILE_BASE64 != '' && env.CSC_KEYCHAIN != ''
        run: |
          profile="$RUNNER_TEMP/Yalqen.provisionprofile"
          printf '%s' "$MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          echo "PROVISIONING_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: Package
        run: |
          signing=()
          if [ -z "$CSC_KEYCHAIN" ]; then
            signing=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          elif [ -n "$PROVISIONING_PROFILE" ]; then
            signing=(-c.mac.provisioningProfile="$PROVISIONING_PROFILE" -c.mac.entitlements=build/entitlements.main.mac.plist)
          fi
          npm run build
          npx electron-builder --mac --publish never -c.directories.output=build/release -c.extraMetadata.version="${TAG#v}" "${signing[@]}"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/browser/build/release/*.dmg
            apps/browser/build/release/*.zip
            apps/browser/build/release/latest-mac.yml
      - name: Attach provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > "build/release/yalqen-${TAG#v}-mac.intoto.jsonl"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(build/release/*.dmg build/release/*.zip build/release/*.blockmap build/release/latest-mac.yml build/release/*.intoto.jsonl)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            { gh release view "$TAG" --json body --jq .body; echo; cat build/release-notes.md; } > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Yalqen ${TAG#v}" \
              --notes-file build/release-notes.md \
              --generate-notes
          fi
          gh release edit "$TAG" --draft=false
      - name: Bump Homebrew cask
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_DISPATCH_TOKEN is not set; the tap bumps itself on its hourly schedule"
            exit 0
          fi
          gh workflow run bump-cask.yml --repo YSamed/homebrew-yalqen
