name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  mac:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-mac.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
