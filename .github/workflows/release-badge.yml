name: Release badge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-badge.yml
      - .github/scripts/release-badge.mjs
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: [Release Please]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Render badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-badge.mjs "$RUNNER_TEMP/badges"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/badges

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
