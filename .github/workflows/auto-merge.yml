name: Auto-merge

on:
  # Runs in the base repo context so the token secret is available to Dependabot PRs; no PR code is checked out.
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable:
    if: >-
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      (github.event.pull_request.user.login == 'YSamed' ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # A PAT is required: merges made with GITHUB_TOKEN do not trigger push workflows (CI, Release Please) on main.
      - if: steps.metadata.outcome == 'skipped' || steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
