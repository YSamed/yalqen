<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{easels.title}}</title>
    <style>
      __YALQEN_STYLES_SLOT__
    </style>
    <style>
      :root {
        color-scheme: light dark;
        --page: var(--bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--text);
        font: 14px/1.5 system-ui;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--page-divider);
      }
      h1 {
        font-size: 18px;
        margin: 0 8px 0 0;
      }
      .group {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        color: #fff;
      }
      p.notice {
        margin: 12px 16px;
        color: var(--text-muted);
      }
      .error {
        color: var(--danger);
      }
      .stage {
        flex: 1;
        overflow: auto;
      }
      .board {
        position: relative;
        width: 3000px;
        height: 2000px;
        background-image: radial-gradient(var(--page-divider) 1px, transparent 1px);
        background-size: 24px 24px;
        touch-action: none;
      }
      .board[data-tool='pen'] {
        cursor: crosshair;
      }
      .board[data-tool='note'] {
        cursor: cell;
      }
      .ink {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .board[data-tool='pen'] .ink {
        pointer-events: auto;
      }
      .ink polyline {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .board[data-tool='erase'] .ink polyline {
        pointer-events: stroke;
        cursor: not-allowed;
      }
      .item {
        position: absolute;
        border: 1px solid var(--page-divider);
        border-radius: 6px;
        background: var(--surface, var(--page));
        overflow: hidden;
      }
      .board[data-tool='erase'] .item {
        cursor: not-allowed;
      }
      .item.note {
        display: flex;
        flex-direction: column;
        background: #fff3a8;
        color: #222;
      }
      .grip {
        flex: none;
        height: 14px;
        background: rgb(0 0 0 / 12%);
        cursor: grab;
      }
      .note textarea {
        flex: 1;
        min-height: 0;
        padding: 6px;
        border: 0;
        outline: 0;
        background: transparent;
        color: inherit;
        font: 13px/1.4 system-ui;
        resize: none;
      }
      .clip img {
        display: block;
        width: 100%;
        cursor: grab;
      }
      .clip a {
        display: block;
        padding: 2px 6px;
        overflow: hidden;
        color: var(--text-muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script src="/easels.js" defer></script>
  </head>
  <body>
    <header>
      <h1>{{easels.title}}</h1>
      <div class="group">
        <select class="field" aria-label="{{easels.title}}" data-picker></select>
        <input class="field" maxlength="80" data-name placeholder="{{easels.name}}" aria-label="{{easels.name}}" />
        <button class="btn tonal" data-create>{{easels.create}}</button>
        <button class="btn" data-rename>{{easels.rename}}</button>
        <button class="btn" data-delete data-confirm="{{easels.confirmDelete}}">{{easels.delete}}</button>
      </div>
      <div class="group" data-tools>
        <button class="btn tonal" data-tool="move">{{easels.toolMove}}</button>
        <button class="btn tonal" data-tool="note">{{easels.toolNote}}</button>
        <button class="btn tonal" data-tool="pen">{{easels.toolPen}}</button>
        <button class="btn tonal" data-tool="erase">{{easels.toolErase}}</button>
        <input type="color" value="#e11d48" aria-label="{{easels.color}}" data-color />
      </div>
    </header>
    <p class="notice" data-readonly hidden>{{easels.readOnly}}</p>
    <p class="notice error" role="alert" hidden>{{easels.failed}}</p>
    <p class="notice" data-empty hidden>{{easels.empty}}</p>
    <div class="stage" hidden>
      <div class="board" data-tool="move" data-placeholder="{{easels.notePlaceholder}}" data-source="{{easels.source}}">
        <svg class="ink" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      </div>
    </div>
  </body>
</html>
