<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{historyPage.title}}</title>
    <style>
      __YALQEN_CONTROLS_SLOT__
    </style>
    <style>
      :root {
        color-scheme: light dark;
        --page: #e6e8eb;
        --text: #1a1b1e;
        --text-muted: #6b6e75;
        --surface: #fff;
        --border: #d3d6da;
        --surface-hover: rgb(16 18 24 / 0.05);
        --accent: #f28c28;
        --warn: #a34a06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #141517;
          --text: #eceef1;
          --text-muted: #9a9ea6;
          --surface: #26282c;
          --border: #373a40;
          --surface-hover: rgb(255 255 255 / 0.06);
          --accent: #f28c28;
          --warn: #f0a35c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          sans-serif;
      }
      main {
        width: min(780px, 100%);
        margin: 0 auto;
        padding: 42px 24px 80px;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 30px;
        letter-spacing: -0.03em;
      }
      form {
        margin-bottom: 30px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .summary {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--text-muted);
      }
      .clear {
        color: var(--accent);
      }
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .day h2 {
        margin: 30px 0 8px;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
      }
      ol > li:not(.day) {
        display: flex;
        align-items: center;
        min-height: 62px;
        gap: 14px;
        border-bottom: 1px solid var(--border);
      }
      time {
        flex: 0 0 42px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .visit {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        padding: 9px 0;
      }
      .visit strong,
      .visit span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .visit strong {
        font-weight: 500;
      }
      .visit span {
        color: var(--text-muted);
        font-size: 12px;
      }
      .visit:hover strong {
        color: var(--accent);
      }
      .empty {
        margin-top: 48px;
        color: var(--text-muted);
        text-align: center;
      }
      .confirm {
        padding: 35px;
        border-radius: 16px;
        background: var(--surface);
      }
      .confirm h2 {
        margin: 0 0 8px;
        font-size: 21px;
      }
      .confirm p {
        color: var(--text-muted);
      }
      .confirm-actions {
        display: flex;
        gap: 8px;
        margin-top: 28px;
      }
      .confirm-actions .danger {
        background-color: #c94d4d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{historyPage.title}}</h1>
      __YALQEN_HISTORY_SLOT__
    </main>
  </body>
</html>
