<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{downloadsPage.title}}</title>
    <style>
      __YALQEN_STYLES_SLOT__
    </style>
    <style>
      :root {
        color-scheme: light dark;
        --page: var(--bg);
        --border: light-dark(#d3d6da, #373a40);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          sans-serif;
      }
      main {
        width: min(780px, 100%);
        margin: 0 auto;
        padding: 42px 24px 80px;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 30px;
        letter-spacing: -0.03em;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .summary {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 8px;
        color: var(--text-muted);
      }
      .clear {
        color: var(--accent);
      }
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        align-items: center;
        min-height: 62px;
        gap: 14px;
        border-bottom: 1px solid var(--border);
      }
      .file {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        padding: 9px 0;
      }
      .file strong,
      .file span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file strong {
        font-weight: 500;
      }
      .file span {
        color: var(--text-muted);
        font-size: 12px;
      }
      .cancelled strong,
      .interrupted strong {
        color: var(--text-muted);
        text-decoration: line-through;
      }
      .commands {
        display: flex;
        flex: none;
        gap: 6px;
      }
      .empty {
        margin-top: 48px;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{downloadsPage.title}}</h1>
      __YALQEN_DOWNLOADS_SLOT__
    </main>
    <script src="yalqen://downloads/downloads.js" defer></script>
  </body>
</html>
