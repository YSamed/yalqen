<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{bookmarksPage.title}}</title>
    <style>
      __YALQEN_STYLES_SLOT__
    </style>
    <style>
      :root {
        color-scheme: light dark;
        --page: var(--bg);
        --border: light-dark(#d3d6da, #373a40);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          sans-serif;
      }
      main {
        width: min(780px, 100%);
        margin: 0 auto;
        padding: 42px 24px 80px;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 30px;
        letter-spacing: -0.03em;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      form {
        display: flex;
        gap: 8px;
      }
      .search-field {
        margin-bottom: 12px;
      }
      .new-folder {
        margin-bottom: 24px;
      }
      .transfer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 24px;
      }
      .new-folder input {
        flex: 1;
      }
      section {
        margin-bottom: 24px;
      }
      .folder {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }
      h2 {
        margin: 12px 0 4px;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
      }
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        min-height: 58px;
        gap: 4px 14px;
        border-bottom: 1px solid var(--border);
      }
      .visit {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        padding: 9px 0;
      }
      .visit strong,
      .visit span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .visit strong {
        font-weight: 500;
      }
      .visit span {
        color: var(--text-muted);
        font-size: 12px;
      }
      .visit:hover strong {
        color: var(--accent);
      }
      summary {
        color: var(--text-muted);
        font-size: 13px;
        cursor: default;
      }
      details[open] {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding-bottom: 12px;
      }
      details[open] summary {
        flex-basis: 100%;
      }
      .danger {
        color: #c94d4d;
        font-size: 13px;
      }
      .empty {
        margin-top: 48px;
        color: var(--text-muted);
        text-align: center;
      }
      .empty-folder {
        margin: 4px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }
      .bulk {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 20px 0;
      }
      .bulk label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bulk output {
        color: var(--text-muted);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      li > input[type='checkbox'] {
        flex-shrink: 0;
      }
      .new-folder select {
        max-width: 240px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{bookmarksPage.title}}</h1>
      __YALQEN_BOOKMARKS_SLOT__
    </main>
    <script src="yalqen://bookmarks/bookmarks.js" defer></script>
  </body>
</html>
