<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{newTab.title}}</title>
    <style>
      __YALQEN_STYLES_SLOT__
    </style>

    <style>
      :root {
        --page: transparent;
        --muted: #50545b;
        --faint: rgb(40 42 48 / 0.5);
        --surface: rgb(255 255 255 / 0.82);
        --glass: rgb(255 255 255 / 0.76);
        --glass-edge:
          0 0 0 0.5px rgb(16 18 24 / 0.1), 0 1px 3px rgb(16 18 24 / 0.08), inset 0 0 0 0.5px rgb(255 255 255 / 0.6),
          inset 0 1px 0 rgb(255 255 255 / 0.5);
        --lift: 0 12px 32px rgb(16 18 24 / 0.07);
        --chip: rgb(255 255 255 / 0.5);
        --well: rgb(16 18 24 / 0.06);
        --hover: rgb(0 0 0 / 0.04);
        --pick: rgb(16 18 24 / 0.07);
        --box: rgb(255 255 255 / 0.96);
        --box-edge: 0 0 0 0.5px rgb(16 18 24 / 0.12), 0 16px 40px rgb(16 18 24 / 0.12);
        --rim: inset 0 0 0 0.5px rgb(255 255 255 / 0.6);
        --shadow: 0 0 0 0.5px rgb(16 18 24 / 0.12), 0 5px 18px rgb(16 18 24 / 0.1);
        --mark-shadow: drop-shadow(0 10px 18px color-mix(in srgb, var(--mark-color, var(--accent)) 28%, transparent));
        --text-muted: var(--muted);
        --surface-hover: var(--hover);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #c2c3c9;
          --faint: rgb(236 238 241 / 0.45);
          --surface: rgb(39 38 41 / 0.82);
          --glass: rgb(255 255 255 / 0.12);
          --glass-edge:
            0 0 0 0.5px rgb(255 255 255 / 0.14), 0 1px 2px rgb(0 0 0 / 0.2), inset 0 0 0 0.5px rgb(255 255 255 / 0.22),
            inset 0 1px 0 rgb(255 255 255 / 0.12);
          --lift: 0 12px 32px rgb(0 0 0 / 0.22);
          --chip: rgb(255 255 255 / 0.07);
          --well: rgb(255 255 255 / 0.08);
          --hover: rgb(255 255 255 / 0.05);
          --pick: rgb(255 255 255 / 0.16);
          --box: #2c2c2e;
          --box-edge: 0 0 0 0.5px rgb(255 255 255 / 0.1), 0 16px 40px rgb(0 0 0 / 0.3);
          --rim: inset 0 0 0 0.5px rgb(255 255 255 / 0.1);
          --shadow: 0 0 0 0.5px rgb(255 255 255 / 0.18), 0 6px 18px rgb(0 0 0 / 0.24);
          --mark-shadow: drop-shadow(0 10px 20px rgb(0 0 0 / 0.4));
          color-scheme: dark;
        }
      }

      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        :root {
          --page: #eeeef0;
          --surface: #fff;
          --glass: #fff;
          --chip: #f6f6f7;
          --well: #e2e2e6;
          --muted: #4a4e54;
          --faint: #5d6168;
        }
      }

      @media (prefers-color-scheme: dark) and (prefers-reduced-transparency: reduce),
        (prefers-color-scheme: dark) and (prefers-contrast: more) {
        :root {
          --page: #0a0a0b;
          --surface: #1b1b1e;
          --glass: #232327;
          --chip: #232327;
          --well: #141416;
          --muted: #c2c3c9;
          --faint: #a4a7ad;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: start center;
        background: var(--page);
        color: var(--text);
        font:
          15px / 1.35 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'Helvetica Neue',
          sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(720px, 100%);
        /* Dia keeps the mark and the search box in the upper third, so the list can grow downwards. */
        padding: 24vh 24px 0;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin-bottom: 26px;
        filter: var(--mark-shadow);
      }

      .mark feFlood {
        flood-color: var(--mark-color, var(--accent));
      }

      .search {
        --query-height: 52px;
        position: relative;
        width: min(652px, 100%);
        height: var(--query-height);
      }

      #search-form {
        --search-field-bg: var(--box);
        --search-field-shadow: var(--box-edge);
        position: absolute;
        z-index: 2;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        height: auto;
        padding: 0;
        border-radius: 22px;
      }

      .query-row {
        display: flex;
        align-items: center;
        gap: 7.5px;
        height: var(--query-height);
        margin-bottom: 10px;
        padding: 0 22px;
        color: var(--muted);
      }

      .query-row .search-icon {
        display: grid;
      }

      .query-row input {
        flex: 1;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 17px;
        user-select: text;
      }

      .query-row input::placeholder {
        color: var(--faint);
        opacity: 1;
      }

      .suggestions {
        margin: 0 8px 4px;
        padding: 0;
        list-style: none;
      }

      .suggestions[hidden] {
        display: none;
      }

      .suggestions li {
        border-radius: 12px;
      }

      .suggestions li:hover {
        background: var(--hover);
      }

      .suggestions li.selected {
        background: var(--pick);
      }

      .suggestions a {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 40px;
        min-width: 0;
        padding: 0 14px;
        font-size: 15px;
      }

      .suggestions .kind {
        display: grid;
        flex: none;
        place-items: center;
        width: 18px;
        height: 18px;
        color: var(--muted);
      }

      .suggestions .kind svg {
        width: 18px;
        height: 18px;
      }

      .suggestions .kind img {
        width: 18px;
        height: 18px;
        border-radius: 4px;
      }

      .suggestions a {
        gap: 0;
      }

      .suggestions .kind {
        margin-right: 14px;
      }

      .suggestions .title {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestions .title.site {
        font-weight: 600;
      }

      .suggestions .detail {
        flex: 0 1 auto;
        min-width: 4em;
        max-width: 45%;
        margin-left: 0.3em;
        overflow: hidden;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search-actions {
        display: flex;
        justify-content: flex-end;
        padding: 6px 14px 14px;
      }

      .engine-submit {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 12px 0 16px;
        border: 0;
        border-radius: 16px;
        background: color-mix(in srgb, var(--accent) 32%, #fff);
        color: #1b1d1c;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        transition: transform 120ms ease-out;
      }

      .engine-submit:active {
        transform: scale(0.96);
      }

      .engine-submit .arrow,
      #search-form:has(input:placeholder-shown) .engine-submit :is(.engine-name, .return) {
        display: none;
      }

      /* Empty, the box is a single line with the arrow beside the field; typing opens the list and the engine button below. */
      #search-form:has(input:placeholder-shown) .search-actions {
        position: absolute;
        top: 0;
        right: 0;
        align-items: center;
        height: var(--query-height);
        padding: 0 14px;
      }

      #search-form:has(input:placeholder-shown) .query-row {
        margin-bottom: 0;
        padding-right: 64px;
      }

      #search-form:has(input:placeholder-shown) .engine-submit {
        justify-content: center;
        width: 32px;
        padding: 0;
        background: var(--well);
        color: var(--faint);
        pointer-events: none;
      }

      #search-form:has(input:placeholder-shown) .engine-submit .arrow {
        display: block;
      }

      .cards {
        position: fixed;
        z-index: 2;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 240px;
      }

      .repo-prompt {
        position: relative;
        padding: 14px 16px 12px;
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--rim), var(--shadow);
        animation: repo-prompt-in 240ms 600ms ease-out backwards;
      }

      .repo-prompt strong {
        display: block;
        padding-right: 20px;
        font-size: 13px;
        font-weight: 600;
      }

      .repo-prompt p {
        margin: 4px 0 10px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .repo-prompt-close {
        position: absolute;
        top: 8px;
        right: 8px;
      }

      .repo-prompt-actions {
        display: flex;
        gap: 6px;
      }

      @keyframes repo-prompt-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .repo-prompt {
          animation: none;
        }
      }

      @media (max-width: 560px) {
        .cards {
          left: 16px;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 72 72" aria-hidden="true">
        <defs>
          <filter id="mark-tint" color-interpolation-filters="sRGB">
            <feFlood result="tint" />
            <feBlend in="SourceGraphic" in2="tint" mode="luminosity" />
            <feComposite in2="SourceAlpha" operator="in" />
          </filter>
        </defs>
        <image href="yalqen://newtab/mark.png" width="72" height="72" filter="url(#mark-tint)" />
      </svg>
      <div class="search">
        <form id="search-form" class="search-field lg" action="yalqen://newtab/search" method="get" role="search">
          <div class="query-row">
            <span class="search-icon" aria-hidden="true">
              <svg
                width="18"
                height="18"
                viewBox="0 0 20 20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              >
                <circle cx="8.8" cy="8.8" r="5.8" />
                <path d="m13.2 13.2 4 4" />
              </svg>
            </span>
            <input
              id="q"
              name="q"
              type="text"
              placeholder="{{newTab.searchPlaceholder}}"
              aria-label="{{newTab.searchLabel}}"
              autocomplete="off"
              spellcheck="false"
              autofocus
              role="combobox"
              aria-expanded="false"
              aria-controls="suggestions"
            />
          </div>
          <ul id="suggestions" class="suggestions" role="listbox" aria-label="{{newTab.suggestions}}" hidden></ul>
          <div class="search-actions">
            <button class="engine-submit" type="submit" aria-label="{{newTab.go}}">
              <span class="engine-name">__YALQEN_ENGINE_SLOT__</span>
              <svg
                class="return"
                width="14"
                height="14"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M13 3.5v4A2.5 2.5 0 0 1 10.5 10H3.5M6.5 7 3.5 10l3 3" />
              </svg>
              <svg
                class="arrow"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </main>
    <div class="cards">__YALQEN_UPDATE_SLOT__ __YALQEN_REPO_PROMPT_SLOT__</div>
    <script src="yalqen://newtab/suggestions.js" defer></script>
  </body>
</html>
