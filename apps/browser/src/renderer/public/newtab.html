<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{newTab.title}}</title>
    <style>
      __YALQEN_STYLES_SLOT__
    </style>

    <style>
      :root {
        --page: transparent;
        --muted: #50545b;
        --faint: rgb(40 42 48 / 0.5);
        --surface: rgb(255 255 255 / 0.82);
        --glass: rgb(255 255 255 / 0.76);
        --glass-edge:
          0 0 0 0.5px rgb(16 18 24 / 0.1), 0 1px 3px rgb(16 18 24 / 0.08), inset 0 0 0 0.5px rgb(255 255 255 / 0.6),
          inset 0 1px 0 rgb(255 255 255 / 0.5);
        --lift: 0 12px 32px rgb(16 18 24 / 0.07);
        --chip: rgb(255 255 255 / 0.5);
        --well: rgb(16 18 24 / 0.06);
        --hover: rgb(0 0 0 / 0.04);
        --rim: inset 0 0 0 0.5px rgb(255 255 255 / 0.6);
        --shadow: 0 0 0 0.5px rgb(16 18 24 / 0.12), 0 5px 18px rgb(16 18 24 / 0.1);
        --mark-shadow: drop-shadow(0 10px 18px rgb(214 92 34 / 0.28));
        --text-muted: var(--muted);
        --surface-hover: var(--hover);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #c2c3c9;
          --faint: rgb(236 238 241 / 0.45);
          --surface: rgb(39 38 41 / 0.82);
          --glass: rgb(255 255 255 / 0.12);
          --glass-edge:
            0 0 0 0.5px rgb(255 255 255 / 0.14), 0 1px 2px rgb(0 0 0 / 0.2), inset 0 0 0 0.5px rgb(255 255 255 / 0.22),
            inset 0 1px 0 rgb(255 255 255 / 0.12);
          --lift: 0 12px 32px rgb(0 0 0 / 0.22);
          --chip: rgb(255 255 255 / 0.07);
          --well: rgb(255 255 255 / 0.08);
          --hover: rgb(255 255 255 / 0.05);
          --rim: inset 0 0 0 0.5px rgb(255 255 255 / 0.1);
          --shadow: 0 0 0 0.5px rgb(255 255 255 / 0.18), 0 6px 18px rgb(0 0 0 / 0.24);
          --mark-shadow: drop-shadow(0 10px 20px rgb(0 0 0 / 0.4));
          color-scheme: dark;
        }
      }

      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        :root {
          --page: #e6e8eb;
          --surface: #fff;
          --glass: #fff;
          --chip: #f3f4f6;
          --well: #dcdfe3;
          --muted: #4a4e54;
          --faint: #5d6168;
        }
      }

      @media (prefers-color-scheme: dark) and (prefers-reduced-transparency: reduce),
        (prefers-color-scheme: dark) and (prefers-contrast: more) {
        :root {
          --page: #141517;
          --surface: #26282c;
          --glass: #2d2f34;
          --chip: #2d2f34;
          --well: #1e2023;
          --muted: #c2c3c9;
          --faint: #a4a7ad;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font:
          15px / 1.35 -apple-system,
          BlinkMacSystemFont,
          'SF Pro Text',
          'Helvetica Neue',
          sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(720px, 100%);
        padding: 0 24px 10vh;
        transform: translateX(
          clamp(min(0px, calc(360px - 50vw)), var(--newtab-center-offset, 0px), max(0px, calc(50vw - 360px)))
        );
      }

      .mark {
        width: 72px;
        height: 72px;
        margin-bottom: 28px;
        filter: var(--mark-shadow);
      }

      .welcome {
        margin: -8px 0 28px;
        text-align: center;
      }

      .welcome h1 {
        margin: 0;
        font-size: clamp(26px, 3.6vw, 36px);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .welcome p {
        max-width: 400px;
        margin: 10px auto 0;
        color: var(--muted);
        font-size: 14px;
      }

      .search {
        position: relative;
        width: min(640px, 100%);
      }

      #search-form {
        --search-field-bg: var(--glass);
        --search-field-shadow: var(--glass-edge), var(--lift);
        --search-field-icon: var(--faint);
      }

      .submit {
        transition:
          background-color 150ms ease-out,
          color 150ms ease-out,
          transform 120ms ease-out;
      }

      .submit:active {
        transform: scale(0.94);
      }

      #search-form:has(input:placeholder-shown) .submit {
        background: var(--well);
        color: var(--faint);
        pointer-events: none;
      }

      .suggestions {
        position: absolute;
        z-index: 1;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        margin: 0;
        padding: 6px;
        border-radius: 20px;
        background: var(--surface);
        box-shadow:
          var(--rim),
          var(--shadow),
          0 12px 40px rgb(0 0 0 / 0.16);
        list-style: none;
      }

      .suggestions[hidden] {
        display: none;
      }

      .suggestions li {
        border-radius: 14px;
      }

      .suggestions li:hover,
      .suggestions li.selected {
        background: var(--hover);
      }

      .suggestions a {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 12px;
        min-width: 0;
      }

      .suggestions .kind {
        display: grid;
        flex: none;
        place-items: center;
        width: 16px;
        height: 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .suggestions .kind img {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }

      .suggestions .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestions .host {
        flex: none;
        max-width: 40%;
        margin-left: auto;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pinned ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 14px;
        max-width: min(640px, 100%);
        margin: 26px 0 0;
        padding: 0;
        list-style: none;
      }

      .pinned a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        width: 72px;
      }

      .pinned .tile {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--glass);
        box-shadow: var(--glass-edge);
        transition:
          transform 150ms ease-out,
          background-color 150ms ease-out;
      }

      .pinned a:hover .tile {
        background: var(--surface);
      }

      .pinned a:active .tile {
        transform: scale(0.96);
      }

      .pinned img {
        width: 24px;
        height: 24px;
        border-radius: 6px;
      }

      .pinned .letter {
        color: var(--muted);
        font-size: 20px;
        font-weight: 600;
      }

      .pinned .name {
        max-width: 100%;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tips {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        width: min(640px, 100%);
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }

      .tips li {
        padding: 12px 14px;
        border-radius: 16px;
        background: var(--chip);
        box-shadow:
          var(--rim),
          0 0 0 0.5px rgb(16 18 24 / 0.08);
      }

      .tips strong,
      .tips small {
        display: block;
      }

      .tips strong {
        margin-bottom: 3px;
        font-size: 12px;
        font-weight: 600;
      }

      .tips small {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      .cards {
        position: fixed;
        z-index: 2;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 240px;
      }

      .repo-prompt {
        position: relative;
        padding: 14px 16px 12px;
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--rim), var(--shadow);
        animation: repo-prompt-in 240ms 600ms ease-out backwards;
      }

      .repo-prompt strong {
        display: block;
        padding-right: 20px;
        font-size: 13px;
        font-weight: 600;
      }

      .repo-prompt p {
        margin: 4px 0 10px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .repo-prompt-close {
        position: absolute;
        top: 8px;
        right: 8px;
      }

      .repo-prompt-actions {
        display: flex;
        gap: 6px;
      }

      @keyframes repo-prompt-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .repo-prompt {
          animation: none;
        }
      }

      @media (max-width: 560px) {
        .cards {
          left: 16px;
          width: auto;
        }
      }

      @media (max-width: 560px) {
        .tips {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="yalqen://newtab/mark.png" alt="" width="72" height="72" />
      __YALQEN_WELCOME_SLOT__
      <div class="search">
        <form id="search-form" class="search-field lg" action="yalqen://newtab/search" method="get" role="search">
          <span class="search-icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            >
              <circle cx="8.8" cy="8.8" r="5.8" />
              <path d="m13.2 13.2 4 4" />
            </svg>
          </span>
          <input
            id="q"
            name="q"
            type="text"
            placeholder="{{newTab.searchPlaceholder}}"
            aria-label="{{newTab.searchLabel}}"
            autocomplete="off"
            spellcheck="false"
            autofocus
            role="combobox"
            aria-expanded="false"
            aria-controls="suggestions"
          />
          <span class="search-actions">
            <button class="icon-btn lg accent submit" type="submit" aria-label="{{newTab.go}}">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" />
              </svg>
            </button>
          </span>
        </form>
        <ul id="suggestions" class="suggestions" role="listbox" aria-label="{{newTab.suggestions}}" hidden></ul>
      </div>
      __YALQEN_PINNED_SLOT__ __YALQEN_TIPS_SLOT__
    </main>
    <div class="cards">
      __YALQEN_UPDATE_SLOT__ __YALQEN_ANNOUNCEMENT_SLOT__ __YALQEN_FEEDBACK_SLOT__ __YALQEN_REPO_PROMPT_SLOT__
    </div>
    <script src="yalqen://newtab/suggestions.js" defer></script>
  </body>
</html>
